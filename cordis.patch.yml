# MCP连接器 插件（DSH Bundle patch）
# 作为 bundle 被合入 profile 时，自动插入本插件行。
# 插件负责连接器目录、三通道连接、凭证存储与 mcp-client 条目动态配置。
- insert:
    - id: mcp-connector
      name: 'dsh-mcp-connector'
      config:
        catalogUrl: 'https://cdn.jsdelivr.net/gh/duhu2000/dsh-mcp-connector-registry@main/catalog.json'
        persistSecrets: true
        entryPrefix: 'mcp'
        refreshSkewMs: 300000
        openBrowser: true
        showSidebarEntry: true
        # 面板 CSP frame-ancestors 白名单：默认仅同源可嵌入。
        # 桌面壳（Tauri/Electron）内嵌面板时需显式追加外壳源，
        # 例如 ['self', 'http://tauri.localhost', 'tauri://localhost']。
        frameAncestors: ['self']
