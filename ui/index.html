        $('#detail-tools').innerHTML = `<div class="tools-empty">${t('连接后可读取服务端工具清单')}</div>`;
        renderPromptPage();
        return;
      }
      const [toolsResult, governanceResult] = await Promise.all([
        call('toolsList', { connectorId, connectionKey: d.connectionKey, ...workspaceParams() }),
        call('governance', {}),
      ]);
      if (loadId !== detailLoadId || !$('#detail-overlay').classList.contains('active')) return;
      detailGovernance = governanceResult.ok ? governanceResult.detail : null;
      if (detailGovernance && toolsResult.detail?.governance) {
        Object.assign(detailGovernance, toolsResult.detail.governance);
      }
      syncGovernanceBar();
      if (!toolsResult.ok) {
        detailFailureState = toolsResult.detail?.connectionState || detailFailureState || 'unavailable';
        detailNeedsReconfigure = true;
        detailReconnectKey = detailFailureState === 'unknown' && d.connected?.length > 0 ? d.connected[0] : '';
        const diagnostic = toolsResult.detail?.diagnostic;
        $('#tools-summary').textContent = t(detailFailureState === 'unknown' ? '工具状态未知' : '工具加载失败');
        const failureHtml = `<div class="tools-error">${esc(toolsResult.message)}${diagnostic ? `<br><br>${esc(t('{stage} · {code}：{message}', { stage: diagnostic.stageLabel || diagnostic.stage, code: diagnostic.code, message: diagnostic.message }))}<br>${esc(t('建议：{action}', { action: diagnostic.action }))}${diagnostic.lastSuccessfulAt ? `<br>${esc(t('最近成功：{at}', { at: new Date(diagnostic.lastSuccessfulAt).toLocaleString(t.locale, { hour12: false }) }))}` : ''}` : ''}</div>`;
        detailToolServers = toolsResult.detail?.servers || [];
        if (detailToolServers.length > 0) {
          renderTools();
          $('#detail-tools').insertAdjacentHTML('afterbegin', failureHtml);
        } else {
          $('#detail-tools').innerHTML = failureHtml;
        }
        const failureLabel = detailFailureState === 'reauth'
          ? t(d.authMode === 'oauth2-pkce' ? '授权已失效' : '凭据已失效')
          : t(detailFailureState === 'unknown' ? '状态尚未确认' : '当前连接异常');
        $('#detail-vendor').textContent = d.vendor ? `${d.vendor} · ${failureLabel}` : failureLabel;
        $('#detail-try-btn').textContent = detailTryLabel(d.authMode === 'oauth2-pkce' && detailFailureState === 'reauth'
          ? t('🔐 重新授权')
          : needsCredential && detailFailureState === 'reauth' ? t('reconfigureCredential') : t('🔄 重新检查'));
        renderPromptPage();
        return;
      }
      detailFailureState = incomplete ? 'incomplete' : (toolsResult.detail?.connectionState || 'healthy');
      detailNeedsReconfigure = incomplete;
      detailReconnectKey = detailFailureState === 'unknown' && d.connected?.length > 0 ? d.connected[0] : '';
      const connectedLabel = incomplete
        ? t('待补充 {count} 个服务', { count: d.missingServers?.length || 1 })
        : `${t(detailFailureState === 'degraded' ? '部分服务可用' : '已连接')} ${t('{count} 个服务', { count: d.connected?.length || 0 })}`;
      $('#detail-vendor').textContent = d.vendor ? `${d.vendor} · ${connectedLabel}` : connectedLabel;
      $('#detail-try-btn').textContent = detailTryLabel(incomplete ? (d.authMode === 'oauth2-pkce' ? t('upgradeOauth') : t('completeSetup')) : t('try'));
      renderPromptPage();
      detailToolServers = toolsResult.detail?.servers || [];
      updateToolsSummary();
      renderTools();
    },
    submitPromptVariables() {
      if (!pendingPrompt) return;
      const values = {};
      $('#modal').querySelectorAll('[data-prompt-variable]').forEach((input) => { values[input.dataset.promptVariable] = input.value; });
      let prompt;
      try { prompt = renderResolvedPrompt(pendingPrompt, values); }
      catch (error) { showModalError(error.message); return; }
      pendingPrompt = null;
      closeModal();
      window.__mcp.sendPrompt(prompt);
    },
    sendPrompt(promptText) {
      const prompt = String(promptText || '').trim();
      if (!prompt) {
        showToast(t('Prompt 不能为空'), false);
        return;
      }
      if (promptRequestId !== null) return;
      if (window.parent === window) {
        showToast(t('请在 DSH Desktop 中使用「发送到新会话」'), false);
        return;
      }
      const requestId = `prompt-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      promptRequestId = requestId;
      setPromptLaunchPending(true);
      showToast(t('正在创建新会话…'), true);
      window.parent.postMessage({
        type: PROMPT_REQUEST_TYPE,
        requestId,
        prompt
      }, window.location.origin);
      promptRequestTimer = setTimeout(() => {
        finishPromptLaunch(requestId, false, t('打开新会话超时，请重试'));
      }, 10000);
    },
    async disconnectCurrent() {
      const name = detailConnector?.name || $('#detail-name').textContent;
      if (!await confirmDialog({
        title: t('断开连接'),
        message: t('确认断开「{name}」的连接？OAuth 授权会被撤销。', { name }),
        confirmLabel: t('断开'),
      })) return;
      // Find connection keys for this connector
      const r = await call('status', workspaceParams());
      if (r.ok) {
        const items = r.detail?.items ?? [];
        for (const item of items) {
          if (item.connectorId === detailConnector?.id) {
            const dr = await call('disconnect', { key: item.key });
            showToast(dr.message, dr.ok);
          }
        }
      }
      closeDetail();
      await refresh();
    },
  };

  $('#detail-close').addEventListener('click', closeDetail);
  $('#detail-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'detail-overlay') closeDetail();
  });
  $('#prompt-next').addEventListener('click', () => {
    promptPage += 1;
    renderPromptPage();
  });
  $('#detail-prompts').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-prompt-index]');
    if (!button) return;
    const prompt = detailPrompts[Number(button.dataset.promptIndex)];
    if (prompt && detailConnector?.connected?.length && !detailNeedsReconfigure) openPromptForm(prompt);
  });
  $('#tools-search').addEventListener('input', () => { toolRenderLimit = 50; renderTools(); });
  $('#connection-policy').addEventListener('change', (event) => applyPolicySelection(event.target));
  $('#policy-rollback').addEventListener('click', rollbackLatestPolicy);
  $('#detail-tools').addEventListener('change', (event) => {
    const select = event.target.closest('select[data-policy-scope]');
    if (select) applyPolicySelection(select);
  });
  $('#detail-tools').addEventListener('click', (event) => {
    const detailButton = event.target.closest('button[data-tool-detail]');
    if (detailButton) {
      openToolDetail(detailButton.dataset.serverName, detailButton.dataset.toolName);
      return;
    }
    if (event.target.closest('#tools-more')) {
      toolRenderLimit += 50;
      renderTools();
    }
  });
  $('#detail-try-btn').addEventListener('click', async () => {
    if (detailReconnectKey) {
      const key = detailReconnectKey;
      detailReconnectKey = '';
      await window.__mcp.reconnect(key);
      return;
    }
    if (detailNeedsReconfigure) {
      if (detailFailureState === 'incomplete' && ['bearer', 'api-key'].includes(detailConnector?.authMode)) {
        openAddConnection('manual', detailConnector);
        return;
      }
      if (detailFailureState === 'reauth' && ['bearer', 'api-key'].includes(detailConnector?.authMode)) {
        openAddConnection('manual', detailConnector);
        return;
      }
      if (detailFailureState === 'incomplete' && detailConnector?.authMode === 'oauth2-pkce') {
        const id = detailConnector.id;
        const r = await call('connect', { connectorId: id }, { timeoutMs: 310_000 });
        showToast(r.message, r.ok);
        if (r.ok) {
          markCommunityCtaEligible();
          await call('healthCheck', { connectorId: id });
          await refreshConnectionUi(id);
        }
        return;
      }
      if (detailFailureState === 'reauth' && detailConnector?.authMode === 'oauth2-pkce') {
        const id = detailConnector.id;
        const r = await call('connect', { connectorId: id }, { timeoutMs: 310_000 });
        showToast(r.message, r.ok);
        if (r.ok) {
          markCommunityCtaEligible();
          await call('healthCheck', { connectorId: id });
          await refreshConnectionUi(id);
        }
        return;
      }
      const id = detailConnector?.id;
      if (id) await window.__mcp.showDetail(id);
      return;
    }
    if (!detailConnector?.connected?.length) {
      const id = detailConnector?.id;
      if (!id) return;
      if (['bearer', 'api-key'].includes(detailConnector.authMode)) {
        openAddConnection('manual', detailConnector);
        return;
      }
      openConnectScope(id);
      return;
    }
    const prompt = detailPrompts[promptPage * PROMPT_PAGE_SIZE];
    if (prompt) {
      openPromptForm(prompt);
    } else {
      showToast(t('暂无预设 Prompt'), false);
    }
  });
  $('#detail-disconnect-btn').addEventListener('click', () => {
    window.__mcp.disconnectCurrent();
  });
  document.addEventListener('keydown', (e) => {
    if ($('#modalMask').classList.contains('show')) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
      if (e.key === 'Tab') {
        const focusable = [...$('#modal').querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled])')];
        if (!focusable.length) return;
        const first = focusable[0]; const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.key === 'Escape' && $('#detail-overlay').classList.contains('active')) closeDetail();
  });
  let statusEventSource = null;
  let statusRefreshTimer = null;
  let statusRefreshRunning = false;
  let statusRefreshPending = false;

  async function refreshOpenToolDetail() {
    if (!detailConnector || !$('#detail-overlay').classList.contains('active')) return;
    const id = detailLoadId;
    const result = await call('toolsList', { connectorId: detailConnector.id, connectionKey: detailConnector.connectionKey, ...workspaceParams(), cachedOnly: true });
    if (id !== detailLoadId || !$('#detail-overlay').classList.contains('active')) return;
    if (!result.detail?.servers) {
      detailToolServers = [];
      renderTools();
      $('#tools-summary').textContent = result.message || t('连接当前不可用');
      return;
    }
    if (result.detail?.servers) {
      detailToolServers = result.detail.servers;
      renderTools();
      const pending = detailToolServers.some((server) => server.pending);
      const unknown = detailToolServers.some((server) => server.unknown);
      const available = detailToolServers.filter((server) => server.ok).length;
      const label = t(pending ? '正在后台发现工具' : unknown && available === 0 ? '工具状态尚未确认'
        : available === detailToolServers.length ? '已连接'
        : available > 0 ? '部分服务可用' : '当前连接异常');
      detailFailureState = pending ? 'unknown' : available > 0 ? 'healthy' : 'unavailable';
      detailNeedsReconfigure = !pending && available === 0;
      detailReconnectKey = '';
      $('#detail-vendor').textContent = detailConnector.vendor ? `${detailConnector.vendor} · ${label}` : label;
      $('#detail-try-btn').textContent = detailTryLabel(detailNeedsReconfigure ? t('🔄 重新检查') : t('try'));
    }
  }

  function scheduleStatusRefresh() {
    if (document.hidden) return;
    statusRefreshPending = true;
    if (statusRefreshRunning) return;
    clearTimeout(statusRefreshTimer);
    statusRefreshTimer = setTimeout(async () => {
      statusRefreshRunning = true;
      statusRefreshPending = false;
      try {
        if (view === 'tools') await loadToolExplorer();
        else if (view === 'market') await loadMarket({ checkHealth: false, preserveScroll: true });
        else await loadInstalled({ preserveScroll: true });
        await refreshOpenToolDetail();
      } finally {
        statusRefreshRunning = false;
        if (statusRefreshPending) scheduleStatusRefresh();
      }
    }, 150);
  }

  function connectStatusEvents() {
    if (typeof EventSource !== 'function' || statusEventSource) return;
    const source = new EventSource('/mcp-connector/events');
    statusEventSource = source;
    source.addEventListener('ready', scheduleStatusRefresh);
    source.addEventListener('status', (event) => {
      try {
        const payload = JSON.parse(event.data);
        if (['connections', 'catalog', 'status', 'tools', 'governance', 'scope'].includes(payload.type)) scheduleStatusRefresh();
      } catch {}
    });
    source.addEventListener('error', () => {
      if (source.readyState === EventSource.CLOSED && statusEventSource === source) statusEventSource = null;
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      connectStatusEvents();
      scheduleStatusRefresh();
    }
  });
  window.addEventListener('pagehide', () => {
    saveViewState();
    notifyDetailState(false);
    clearTimeout(statusRefreshTimer);
    statusEventSource?.close();
    statusEventSource = null;
  });

  function refresh() { return view === 'tools' ? loadToolExplorer() : view === 'market' ? loadMarket() : loadInstalled(); }
  function syncTabs() {
    searchInput.placeholder = t(view === 'tools' ? '搜索工具名称或描述…' : '搜索连接器…');
    $('#refresh').textContent = t(view === 'tools' ? '刷新工具视图' : '刷新连接器目录');
    $('#refresh').title = $('#refresh').textContent;
    document.querySelectorAll('#tabs button').forEach((button) => button.classList.toggle('active', button.dataset.view === view));
    syncMarketNav();
  }

  $('#add-connection').addEventListener('click', () => openAddConnection('json'));
  $('#market-nav').addEventListener('click', (event) => {
    const categoryFilter = event.target.closest('[data-category-filter]');
    if (categoryFilter) {
      marketCategory = categoryFilter.dataset.categoryFilter || '';
      pendingViewScroll = null; main.scrollTop = 0;
      loadMarket({ checkHealth: false });
    }
  });
  main.addEventListener('click', (event) => {
    const sectionToggle = event.target.closest('[data-section-toggle]');
    if (sectionToggle) {
      const section = sectionToggle.dataset.sectionToggle;
      if (expandedMarketSections.has(section)) expandedMarketSections.delete(section);
      else expandedMarketSections.add(section);
      loadMarket({ checkHealth: false, preserveScroll: true });
    }
  });
  $('#refresh').addEventListener('click', async () => {
    if (view === 'tools') { await loadToolExplorer(); return; }
    const r = await call('refreshCatalog', {});
    showToast(r.message, r.ok);
    if (r.ok) {
      const health = await call('healthCheck', {});
      showToast(`${r.message}；${health.message}`, health.ok);
    }
    await refresh();
  });

  $('#tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    view = btn.dataset.view;
    pendingViewScroll = null; main.scrollTop = 0;
    explorerSequence++; explorerDetailSequence++;
    syncTabs();
    refresh();
  });

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    pendingViewScroll = null; main.scrollTop = 0;
    explorerSequence++; explorerOffset = 0;
    clearTimeout(searchTimer);
    if (view === 'tools') { searchTimer = setTimeout(() => { if (view === 'tools') void loadToolExplorer(); }, 200); return; }
    expandedMarketSections.clear();
    refresh();
  });

  // 静态标记里的中文同样走 t()：中文（默认）逐字不变，英文时整体切换。
  // 这里显式列举而不用通用的属性扫描机制：面板只有两种语言，逐项更直观、也便于测试。
  function applyStaticLocale() {
    document.title = t('MCP连接器');
    const setText = (selector, msgid) => { const node = $(selector); if (node) node.textContent = t(msgid); };
    setText('#tab-market', '市场');
    setText('#tab-installed', '已安装');
    setText('#tab-tools', '工具');
    setText('#add-connection', '＋ 添加连接');
    setText('#prompt-title', '试试这样用');
    setText('#prompt-next', '换一批');
    setText('#tools-title', '工具详情');
    setText('#governance-title', '连接策略');
    setText('#policy-rollback', '撤销最近变更');
    setText('#tools-loading', '加载中...');
    setText('#detail-try-btn', '💬 去试试');
    setText('#detail-disconnect-btn', '断开连接');
    setText('#tools-summary', '加载中…');
    const setAttr = (selector, attr, msgid) => { const node = $(selector); if (node) node.setAttribute(attr, t(msgid)); };
    setAttr('#market-nav', 'aria-label', '市场分类导航');
    setAttr('#detail-close', 'aria-label', '关闭详情');
    setAttr('#detail-close', 'title', '关闭详情');
    setAttr('#connection-policy', 'aria-label', '连接策略');
  }

  applyStaticLocale();
  syncTabs();
  if (viewStateReady) restoreViewState();
  requestWorkspaceContext();
  connectStatusEvents();
  refresh();
})();
</script>
</body>
</html>
