name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # DSH 依赖由 Host 提供；legacy-peer-deps 避免 npm 尝试拼装一套不完整的 Host。
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run check

  windows:
    name: windows (24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 目标问题来自 Windows Desktop；使用与 Linux 相同的完整门禁防止平台回归。
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Windows CLI native process regression
        run: node --test --test-reporter=tap test/cli-providers.test.mjs
      - run: npm run check

  zod-compat:
    name: zod compatibility (4.6.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm install zod@4.6.6 --no-save --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm test

  host-visibility:
    name: Host visibility (${{ matrix.os }}, ${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        host: [0.2.1-rc.2, 0.2.1-rc.3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Isolated published Host code only: no profile, Desktop UI or real MCP.
      # Pin the internal-view compatibility contract on each supported release.
      - name: Install isolated Host runtime
        run: >-
          npm install --prefix .host-runtime-fixture --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          @deepseek-ai/cordis@4.0.5
          @deepseek-ai/dsh-tools@${{ matrix.host }}
          @deepseek-ai/dsh-scope@${{ matrix.host }}
          @deepseek-ai/dsh-llm@${{ matrix.host }}
          @deepseek-ai/dsh-sandbox@${{ matrix.host }}
      - name: Real ToolRuntime visibility lifecycle (not Desktop UI acceptance)
        run: >-
          node -e "const {spawnSync}=require('node:child_process');
          const anchor=require('node:path').resolve('.host-runtime-fixture/package.json');
          const r=spawnSync(process.execPath,['--test','test/visibility-host.test.mjs'],
          {stdio:'inherit',env:{...process.env,DSH_HOST_INTEGRATION_ANCHOR:anchor}});
          if(r.error)throw r.error;process.exit(r.status??1)"

  smart-host:
    name: Smart mode Host (${{ matrix.os }}, 0.2.2-rc.1)
    runs-on: ${{ matrix.os }}
    # Pin the published predecessor so release PRs can pass before their version is published.
    env:
      DSH_SMART_PACKAGE_BASELINE_VERSION: 0.2.110
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      # Published SDK code only. No DSH CLI/profile loader, real key, model or MCP.
      - run: >-
          npm install --prefix .smart-host-runtime --ignore-scripts --no-audit --no-fund
          @deepseek-ai/dsh@0.2.2-rc.1
      - name: Offline contracts must run without skips
        run: node scripts/run-smart-mode-qa.mjs check --anchor .smart-host-runtime/package.json
      - run: npm install --global pnpm@11.1.1 --ignore-scripts
      - name: Actual package install, upgrade, process restart and stable downgrade
        env:
          DSH_HOST_INTEGRATION_ANCHOR: ${{ github.workspace }}/.smart-host-runtime/package.json
          DSH_SMART_PACKAGE_EVIDENCE_DIR: ${{ runner.temp }}/qmcp-4963-package-evidence
        run: node scripts/check-smart-mode-package-lifecycle.mjs
      - name: Windows Git Bash with GNU tar ahead of System32
        if: runner.os == 'Windows'
        shell: bash
        env:
          DSH_HOST_INTEGRATION_ANCHOR: ${{ github.workspace }}/.smart-host-runtime/package.json
          DSH_SMART_PACKAGE_EVIDENCE_DIR: ${{ runner.temp }}/qmcp-4963-package-evidence-msys
        run: |
          export PATH="/usr/bin:$PATH"
          tar --version
          node scripts/check-smart-mode-package-lifecycle.mjs

  fresh-install:
    name: Fresh generation install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.1.1 --ignore-scripts
      - run: node scripts/check-fresh-install.mjs

  pr-package:
    name: PR test package
    if: github.event_name == 'pull_request'
    needs: [test, windows, zod-compat, host-visibility, smart-host, fresh-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp an installable prerelease version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          import { smartModeQaVersion } from "./scripts/fixtures/smart-mode-package-version.mjs";
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          p.version = smartModeQaVersion(p.version, { pullRequest: Number(process.env.PR_NUMBER),
          buildNumber: Date.now(), commit: process.env.PR_HEAD_SHA });
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
      - run: npm pack --ignore-scripts
      - run: shasum -a 256 dsh-mcp-connector-*.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-mcp-connector-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dsh-mcp-connector-*.tgz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
