name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.19.0
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw new Error('tag '+process.env.GITHUB_REF_NAME+' != v'+p.version)"
      - name: Require current product media before publishing
        run: npm run storefront:freshness
      - run: npm run check
      - name: Build and inspect the release tarball
        shell: bash
        run: |
          dir=$(mktemp -d)
          npm run pack:reviewed -- "$dir"
          archives=("$dir"/*.tgz)
          test "${#archives[@]}" -eq 1
          echo "REVIEWED_TGZ=${archives[0]}" >> "$GITHUB_ENV"
          digest=$(openssl dgst -sha512 -binary "${archives[0]}" | openssl base64 -A)
          echo "REVIEWED_INTEGRITY=sha512-$digest" >> "$GITHUB_ENV"
      - name: Publish the reviewed tarball with Trusted Publishing
        run: npm publish "$REVIEWED_TGZ" --access public
      - name: Confirm npm serves the reviewed bytes
        shell: bash
        run: |
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          for attempt in 1 2 3 4 5; do
            if [[ "$(npm view "$spec" dist.integrity --registry=https://registry.npmjs.org --prefer-online)" == "$REVIEWED_INTEGRITY" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published dist.integrity did not match the reviewed tarball"
          exit 1
      - name: Compare the npm download with the reviewed tarball
        shell: bash
        run: |
          set -euo pipefail
          printf 'Commit: %s | Tag: %s\n' "$(git rev-parse HEAD)" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/verify-published.py "${GITHUB_REF_NAME#v}" "$REVIEWED_TGZ" "$REVIEWED_INTEGRITY" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
