name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_run:
        description: Original Release tag-push run ID (run from main)
        type: string
        required: true
      create_release:
        description: Create the GitHub Release if missing after verification
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    if: github.event_name == 'push' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.19.0
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw new Error('tag '+process.env.GITHUB_REF_NAME+' != v'+p.version)"
      - name: Require current product media before publishing
        run: npm run storefront:freshness
      - run: npm run check
      - name: Build and inspect the release tarball
        shell: bash
        run: |
          dir=$(mktemp -d)
          npm run pack:reviewed -- "$dir"
          archives=("$dir"/*.tgz)
          test "${#archives[@]}" -eq 1
          echo "REVIEWED_TGZ=${archives[0]}" >> "$GITHUB_ENV"
          digest=$(openssl dgst -sha512 -binary "${archives[0]}" | openssl base64 -A)
          printf 'sha512-%s\n' "$digest" > "${archives[0]}.integrity"
      - name: Preserve the reviewed archive before publishing
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-npm-${{ github.run_id }}
          path: |
            ${{ env.REVIEWED_TGZ }}
            ${{ env.REVIEWED_TGZ }}.integrity
          if-no-files-found: error
          retention-days: 90
      - name: Check that the exact version is unpublished
        shell: bash
        run: |
          # Query the package index so the preflight does not prime a 404 for the new version.
          curl --fail --silent --show-error "https://registry.npmjs.org/dsh-mcp-connector?run=$GITHUB_RUN_ID" |
            jq -e --arg v "${GITHUB_REF_NAME#v}" '(.versions | type == "object") and (.versions | has($v) | not)' > /dev/null
      - name: Publish the reviewed tarball with Trusted Publishing
        run: npm publish "$REVIEWED_TGZ" --access public

  verify:
    needs: publish
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && github.event.created && !github.event.deleted &&
         (needs.publish.result == 'success' || (github.run_attempt != '1' && needs.publish.result == 'skipped'))))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN: ${{ inputs.source_run || github.run_id }}
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the original tag and reviewed run
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { reviewedRun } = require('./scripts/release-recovery.cjs');
            const { tag, sha } = await reviewedRun(github, context.repo, process.env.SOURCE_RUN);
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-npm-${{ env.SOURCE_RUN }}
          path: ${{ runner.temp }}/reviewed
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Compare the exact-version npm download with the preserved archive
        shell: bash
        env:
          TAG: ${{ steps.source.outputs.tag }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/reviewed/dsh-mcp-connector-${TAG#v}.tgz"
          printf 'Commit: %s | Tag: %s | Source run: %s\n' "$SHA" "$TAG" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/verify-published.py "${TAG#v}" "$archive" "$(cat "$archive.integrity")" | tee -a "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: verify
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (github.event_name == 'push' || inputs.create_release)
    concurrency: create-github-release-${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        with:
          script: |
            const { ensureRelease } = require('./scripts/release-recovery.cjs');
            core.info(await ensureRelease(github, context.repo, process.env.TAG, process.env.SHA));
