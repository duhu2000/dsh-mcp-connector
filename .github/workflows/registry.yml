name: Registry health

on:
  push:
    branches: ['feat/**']
    paths:
      - 'catalog/**'
      - 'registry/**'
      - 'lib/probe.js'
      - 'lib/schema.js'
      - 'scripts/*registry*.mjs'
      - 'scripts/probe-connector.mjs'
  pull_request:
    paths:
      - 'catalog/**'
      - 'registry/**'
      - 'lib/probe.js'
      - 'lib/schema.js'
      - 'scripts/*registry*.mjs'
      - 'scripts/probe-connector.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run registry:build
      - run: git diff --exit-code -- registry/catalog.json
      - run: npm run registry:validate

  live-probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node scripts/probe-connector.mjs catalog/catalog.json --allow-partial --output probe-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-probe-report
          path: probe-report.json
